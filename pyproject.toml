[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tdash"
version = "0.1.0"
description = "Dashboard TUI personnalisable : perfs, météo (weathr), lecteur + cava, notifications, processus, Proxmox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "textual>=8.0",
  "psutil>=5.9",
  "pyte>=0.8.2",
  "proxmoxer>=2.0",
  "requests>=2.28",
]

[project.scripts]
tdash = "tdash.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tdash = ["config.example.toml"]
